services:
  backend:
    build: .
    container_name: jobtracker-backend
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: super-secret-jwt-key-change-in-production-at-least-256-bits
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: jobtracker
    ports:
    - 8080:8080
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
