services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtracker-backend
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-must-be-at-least-256-bits-long}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      JOBTRACKER_AUTO_DB: 'false'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: jobtracker
    ports:
    - 8080:8080
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://localhost:8080/actuator/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
    - portfolio-net
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtracker-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    ports:
    - 3000:3000
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
